name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/fetch_engine.py
      - run: python scripts/generate_extensions.py
      - run: python -m unittest discover -p "test_*.py" -v
        working-directory: src
        env:
          QT_QPA_PLATFORM: offscreen
  browser-title-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s browser-extension/tests -p "test_*.py" -v
